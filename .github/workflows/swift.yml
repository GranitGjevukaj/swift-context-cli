name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.macos }})
    runs-on: ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: [macos-14, macos-13]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test
